name: Solicitud de cambio de historia
description: Proponer un cambio a una historia o criterio (Sección 10.7 del SQAP)
title: 'Cambio: US-NN '
labels: ['tipo:cambio']
body:
  - type: input
    id: historia
    attributes: { label: Historia afectada, placeholder: 'US-02' }
    validations: { required: true }
  - type: dropdown
    id: tipo
    attributes:
      { label: Tipo de cambio, options: [Nueva, Modificar, Dividir, Descartar, Cambiar criterio] }
  - type: textarea
    id: cambio
    attributes: { label: Cambio pedido y motivo }
    validations: { required: true }
  - type: input
    id: solicitante
    attributes: { label: Quién lo pide }
  - type: textarea
    id: impacto
    attributes:
      {
        label: Impacto (lo completa el Líder),
        description: 'Puntos, sprint, pruebas, RNF o umbral del SQAP',
      }
