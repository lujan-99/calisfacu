name: Tarea del sprint
description: Una tarea de la pila del sprint (docs/backlog/backlog.md)
title: 'T-NNN: '
labels: ['tipo:tarea']
body:
  - type: input
    id: historia
    attributes: { label: Historia, placeholder: 'US-01' }
    validations: { required: true }
  - type: dropdown
    id: sprint
    attributes: { label: Sprint, options: [Semana 1, Semana 2, Semana 3, Semana 4] }
  - type: input
    id: horas
    attributes: { label: Horas estimadas }
  - type: dropdown
    id: responsable
    attributes: { label: Responsable, options: [Lujan, Galvan] }
  - type: textarea
    id: criterio
    attributes: { label: Criterio de aceptación o métrica que cubre }
