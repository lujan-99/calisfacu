# Respaldo de la base de producción (SQAP, Sección 10.6; métrica M14: RPO 24 h, RTO 2 h).
# Es la única tarea en GitHub Actions: debe correr cada día a las 03:00 aunque la computadora de Jenkins esté apagada.
# Secretos (Settings → Secrets and variables → Actions, ambiente "production"). Hasta el release v1.0 DATABASE_URL apunta a
# la base de staging (SQAP, Tabla 22), para que M14 tenga evidencia antes de que exista producción.
#   DATABASE_URL       URL de PostgreSQL de producción
#   BACKUP_PASSPHRASE  frase para cifrar el respaldo (AES-256)
name: backup
on:
  schedule:
    - cron: '0 7 * * *' # respaldo: 03:00 en Bolivia (UTC-4)
    - cron: '0 8 * * 5' # prueba de restauración: cada viernes (día 5 del sprint), 04:00 en Bolivia
  workflow_dispatch:
    inputs:
      restaurar:
        description: 'Probar la restauración del último respaldo (también corre sola el día 5)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  respaldar:
    if: ${{ github.event.schedule == '0 7 * * *' || (github.event_name == 'workflow_dispatch' && !inputs.restaurar) }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Respaldar y cifrar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          docker run --rm -e DATABASE_URL postgres:16 sh -c 'pg_dump "$DATABASE_URL" -Fc' > db.dump
          test -s db.dump
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" -o "calis-$(date +%F).dump.gpg" db.dump
          rm db.dump
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-db-${{ github.run_id }}
          path: '*.dump.gpg'
          retention-days: 30

  restaurar:
    if: ${{ github.event.schedule == '0 8 * * 5' || (github.event_name == 'workflow_dispatch' && inputs.restaurar) }}
    environment: production
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: calis, POSTGRES_PASSWORD: calis, POSTGRES_DB: restaurada }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calis" --health-interval 5s --health-retries 10
    steps:
      - name: Descargar el último respaldo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # El último artefacto de respaldo vigente (las ejecuciones de restauración no dejan artefacto).
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq \
            '[.artifacts[] | select(.name | startswith("respaldo-db-")) | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id')
          test -n "$id" && test "$id" != null
          gh run download "$id" -R "$GITHUB_REPOSITORY" -D respaldo
      - name: Restaurar y comparar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          inicio=$(date +%s)
          f=$(find respaldo -name '*.dump.gpg' | head -1)
          gpg --batch --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -o db.dump -d "$f"
          # Sin dueños ni permisos: el respaldo de Render trae GRANT para el rol postgres, que aquí no existe.
          docker run --rm --network host -e PGPASSWORD=calis -v "$PWD":/w postgres:16 \
            pg_restore -h localhost -U calis -d restaurada --no-owner --no-privileges /w/db.dump
          tablas=$(docker run --rm --network host -e PGPASSWORD=calis postgres:16 \
            psql -h localhost -U calis -d restaurada -tAc "select count(*) from information_schema.tables where table_schema='public'")
          echo "Tablas restauradas: $tablas"
          test "$tablas" -gt 0
          echo "RTO medido: $(( $(date +%s) - inicio )) segundos (objetivo ≤ 7200, M14)"
