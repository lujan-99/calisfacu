# Servicios para desarrollo local (SQAP, Sección 7.1: ambiente Local)
# PostgreSQL se publica en el puerto 55432 (no en 5432) para no chocar con un PostgreSQL ya instalado en la máquina.
# Se cambia con POSTGRES_PORT en un archivo .env junto a este docker-compose.yml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: calis
      POSTGRES_PASSWORD: calis
      POSTGRES_DB: calis
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calis']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - '${REDIS_PORT:-6379}:6379'
volumes:
  pgdata: {}
